<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ZELORA STUDYS</title>
    <meta
      name="description"
      content="ZELORA STUDYS unified education management platform for students, teachers, and administrators."
    />
    <meta property="og:title" content="ZELORA STUDYS" />
    <meta
      property="og:description"
      content="ZELORA STUDYS unified education management platform for students, teachers, and administrators."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var personalModeKey = 'tuition_ecosystem_theme_v1';
          var personalPaletteKey = 'zelora_theme_palette_v1';
          var settingsKey = 'tuition_ecosystem_dev_app_settings_v1';
          var validPalettes = {
            slate_grey: 1,
            indigo: 1,
            gold: 1,
            teal: 1,
            crimson_red: 1,
            sunset_orange: 1,
            ocean_blue: 1,
            royal_purple: 1,
            rose_pink: 1,
            emerald: 1,
          };
          var savedMode = window.localStorage.getItem(personalModeKey);
          var savedPalette = window.localStorage.getItem(personalPaletteKey);
          var allowPersonal = true;
          var adminDefaultMode = 'dark';
          var adminDefaultPalette = 'gold';
          var rawSettings = window.localStorage.getItem(settingsKey);
          if (rawSettings) {
            try {
              var parsed = JSON.parse(rawSettings);
              var ap = parsed && parsed.settings && parsed.settings.appearanceDefaults;
              if (ap) {
                if (ap.defaultTheme === 'light' || ap.defaultTheme === 'dark') {
                  adminDefaultMode = ap.defaultTheme;
                }
                if (ap.defaultAccentPalette && validPalettes[ap.defaultAccentPalette]) {
                  adminDefaultPalette = ap.defaultAccentPalette;
                }
                if (typeof ap.allowPersonalThemePreference === 'boolean') {
                  allowPersonal = ap.allowPersonalThemePreference;
                }
              }
            } catch (err) {}
          }
          var theme =
            allowPersonal && (savedMode === 'light' || savedMode === 'dark')
              ? savedMode
              : adminDefaultMode;
          var palette =
            allowPersonal && savedPalette && validPalettes[savedPalette]
              ? savedPalette
              : adminDefaultPalette;
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          root.setAttribute('data-palette', palette);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-[var(--accent-tint)] selection:text-[var(--text-primary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
